name: hardware-test

on:
  workflow_dispatch:
    inputs:
      image:
        description: >
          Image to test. Empty takes the newest master build of openUC2/ImSwitch
          (the image behind the edge tag). A bare tag (e.g. sha-7d3adda) resolves
          against ghcr.io/openuc2/imswitch; a full ref (repo/image:tag) is used as-is.
        required: false
        default: ""
      tests:
        description: >
          Space-separated e2e folders to run (e.g. "board firmware"). Empty
          runs the whole suite, including motor/camera/laser/ledmatrix.
        required: false
        default: ""
  # PRs with the "hardware-test" label: runs when the label is added and on
  # every push to the PR while it is set.
  pull_request:
    types: [labeled, synchronize, reopened]

# One rig, one run.
concurrency:
  group: hardware-test-${{ github.repository }}
  cancel-in-progress: false

jobs:
  hardware-test:
    # PRs only from branches of this repository: the job runs on the rig, and
    # code from someone else's fork must not get there. Adding any other label
    # to a labelled PR does not start another run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'hardware-test') &&
       (github.event.action != 'labeled' || github.event.label.name == 'hardware-test'))
    runs-on: [self-hosted, uc2-rig]

    steps:
      - name: Checkout os-rpi
        uses: actions/checkout@v7
        with:
          path: os-rpi

      - name: Checkout ImSwitch
        uses: actions/checkout@v7
        with:
          repository: LeonardPertsch/ImSwitch
          path: ImSwitch

      - name: Determine image and tests
        id: config
        env:
          # Without it gh falls back to the account logged in on the Pi!
          GH_TOKEN: ${{ github.token }}
          IMAGE_INPUT: ${{ inputs.image }}
          TESTS_INPUT: ${{ inputs.tests }}
        run: |
          IMAGE="$IMAGE_INPUT"
          TESTS="$TESTS_INPUT"

          # A PR tests the image it would deploy: the pin in its ImSwitch
          # package, digest included, exactly as forklift runs it.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            IMAGE="$(awk '$1 == "image:" && $2 ~ /^ghcr\.io\/openuc2\/imswitch[:@]/ { print $2; exit }' \
              os-rpi/deployments/imswitch.pkg/deployment.compose.yml | tr -d "\"'")"
            if [ -z "$IMAGE" ]; then
              echo "::error::no ImSwitch image pinned in deployments/imswitch.pkg/deployment.compose.yml"
              exit 1
            fi
          fi

          # Every successful master push publishes sha-<commit> and moves edge.
          # Pick the newest by date ourselves: the API has answered with an
          # older run first before.
          if [ -z "$IMAGE" ]; then
            SHA="$(gh api "repos/openUC2/ImSwitch/actions/workflows/build-docker-server.yaml/runs?branch=master&event=push&status=success&per_page=20" \
              --jq '.workflow_runs | max_by(.created_at) | .head_sha // empty')"
            if [ -z "$SHA" ]; then
              echo "::error::no successful master build of openUC2/ImSwitch found"
              exit 1
            fi
            IMAGE="sha-${SHA::7}"
          fi

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          # Artifact names must not contain / or :, a full ref has both. The
          # digest adds nothing a reader needs there.
          NAME="${IMAGE%@*}"
          echo "report=hil-report-${NAME//[\/:]/-}" >> "$GITHUB_OUTPUT"

          echo "Runner:        $(hostname)"
          echo "Image to test: $IMAGE"
          echo "Tests:         ${TESTS:-all}"
          echo "Testing \`$IMAGE\` on \`$(hostname)\`, tests: ${TESTS:-all}" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the e2e suite against the image under test
        working-directory: ImSwitch/imswitch/imcontrol/_test/e2e
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          TESTS: ${{ steps.config.outputs.tests }}
        run: |
          ci/hil-run.sh \
            --image "$IMAGE" \
            --yes \
            --out ci/reports \
            --tests "$TESTS"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.config.outputs.report || 'hil-report' }}
          path: ImSwitch/imswitch/imcontrol/_test/e2e/ci/reports/
          if-no-files-found: warn
          retention-days: 30
